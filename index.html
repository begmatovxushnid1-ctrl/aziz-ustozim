<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayt Vaqtincha To'xtatilgan | Koreys Tili</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #030712;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .box {
      max-width: 400px;
      padding: 30px 24px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 6px 14px;
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">🚧</div>
    <h1>Sayt vaqtincha ishlamaydi</h1>
    <p>Texnik profilaktika ishlari olib borilmoqda. Tez orada qayta ishga tushiriladi!</p>
    <div class="badge">Tez kunda qaytamiz</div>
  </div>
</body>
</html>
